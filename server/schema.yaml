openapi: 3.0.3
info:
  title: Virtual Pipe API
  version: 0.1.0
paths:
  /pipesets:
    post:
      operationId: createPipeset
      tags:
      - pipesets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Pipeset'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipesetResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipesetValidationError'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
  /pipesets/{pipeset_id}:
    get:
      operationId: getPipeset
      parameters:
      - in: path
        name: pipeset_id
        schema:
          type: integer
        required: true
      tags:
      - pipesets
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipesetResponse'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
          description: ''
components:
  schemas:
    AttributeDefinition:
      type: object
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/TypeEnum'
        min:
          type: integer
          maximum: 9007199254740991
          minimum: -9007199254740991
          format: int64
        max:
          type: integer
          maximum: 9007199254740991
          minimum: -9007199254740991
          format: int64
        categories:
          type: array
          items:
            type: string
      required:
      - name
      - type
    ErrorResponse:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    Pipeset:
      type: object
      properties:
        attribute_definitions:
          type: array
          items:
            $ref: '#/components/schemas/AttributeDefinition'
        name:
          type: string
        bbox:
          type: array
          items:
            type: number
            format: double
          description: '[west, south, east, north]; longitude -180..180, latitude
            -90..90; west < east and south < north.'
          maxItems: 4
          minItems: 4
      required:
      - bbox
      - name
    PipesetResponse:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          readOnly: true
        count:
          type: integer
          minimum: 0
          readOnly: true
        bbox:
          type: array
          items:
            type: number
            format: double
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/PipesetStatus'
          readOnly: true
        attribute_definitions:
          type: array
          items:
            $ref: '#/components/schemas/AttributeDefinition'
          readOnly: true
      required:
      - attribute_definitions
      - bbox
      - count
      - id
      - name
      - status
    PipesetStatus:
      enum:
      - pending
      - failed
      - completed
      type: string
      description: |-
        * `pending` - Pending
        * `failed` - Failed
        * `completed` - Completed
    PipesetValidationError:
      type: object
      properties:
        name:
          type: array
          items:
            type: string
        bbox: {}
        attribute_definitions: {}
        non_field_errors:
          type: array
          items:
            type: string
    TypeEnum:
      enum:
      - string
      - number
      - boolean
      - category
      type: string
      description: |-
        * `string` - string
        * `number` - number
        * `boolean` - boolean
        * `category` - category
