openapi: 3.0.3
info:
  title: Virtual Pipe API
  version: 0.1.0
paths:
  /api/attribute-sets/:
    get:
      operationId: listAttributeSets
      tags:
      - attribute-sets
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttributeSet'
          description: ''
    post:
      operationId: createAttributeSet
      tags:
      - attribute-sets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributeSetCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AttributeSetCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AttributeSetCreate'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributeSet'
          description: ''
        '400':
          description: Validation errors keyed by field name, or an invalid JSON body.
  /api/districts/:
    get:
      operationId: searchDistricts
      parameters:
      - in: query
        name: q
        schema:
          type: string
        description: Japanese or romanized place name
      tags:
      - districts
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/District'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DistrictSearchError'
          description: ''
  /api/health/:
    get:
      operationId: getHealth
      tags:
      - health
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
          description: ''
  /api/pipesets/:
    get:
      operationId: listPipeSets
      tags:
      - pipesets
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/PipeSetSummary'
          description: ''
    post:
      operationId: createPipeSet
      tags:
      - pipesets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PipeSetCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PipeSetCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PipeSetCreate'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipeSetAccepted'
          description: ''
        '400':
          description: Invalid pipe set request.
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipeSetCreateError'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipeSetCreateError'
          description: ''
  /api/pipesets/{id}/:
    get:
      operationId: getPipeSetStatus
      parameters:
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: The submitted pipe-set ID.
        required: true
      tags:
      - pipesets
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PipeSetStatus'
          description: ''
        '404':
          description: Pipe set not found.
  /api/pipesets/{id}/export/:
    get:
      operationId: downloadPipeSet
      parameters:
      - in: query
        name: file_format
        schema:
          type: string
          enum:
          - csv
          - parquet
        description: File format to download.
        required: true
      - in: path
        name: id
        schema:
          type: string
          format: uuid
        description: The pipe-set ID.
        required: true
      tags:
      - pipesets
      security:
      - {}
      responses:
        '200':
          headers:
            Content-Disposition:
              schema:
                type: string
              description: Attachment filename based on the saved pipe-set name.
          content:
            text/csv:
              schema:
                type: string
                format: binary
            application/vnd.apache.parquet:
              schema:
                type: string
                format: binary
          description: ''
        '400':
          description: Missing or unsupported file format.
        '404':
          description: Pipe set not found.
        '409':
          description: Pipe set cannot be exported.
  /api/prefectures/:
    get:
      operationId: listPrefectures
      tags:
      - prefectures
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Prefecture'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PrefectureSearchError'
          description: ''
  /api/road-data/:
    get:
      operationId: getRoadData
      tags:
      - road-data
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoadData'
          description: ''
  /api/road-data/setups/:
    post:
      operationId: createRoadDataSetup
      tags:
      - road-data
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoadDataSetupRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RoadDataSetupRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RoadDataSetupRequest'
        required: true
      security:
      - {}
      responses:
        '202':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoadDataSetup'
          description: ''
        '400':
          description: Invalid region.
        '409':
          description: A setup is already active or the region is already active.
        '503':
          description: The setup queue is unavailable.
components:
  schemas:
    AttributeDefinition:
      oneOf:
      - $ref: '#/components/schemas/StringAttribute'
      - $ref: '#/components/schemas/IntegerAttribute'
      - $ref: '#/components/schemas/DecimalAttribute'
      - $ref: '#/components/schemas/BooleanAttribute'
      - $ref: '#/components/schemas/DateAttribute'
      - $ref: '#/components/schemas/GeneratedIdAttribute'
      discriminator:
        propertyName: type
        mapping:
          string: '#/components/schemas/StringAttribute'
          integer: '#/components/schemas/IntegerAttribute'
          decimal: '#/components/schemas/DecimalAttribute'
          boolean: '#/components/schemas/BooleanAttribute'
          date: '#/components/schemas/DateAttribute'
          id: '#/components/schemas/GeneratedIdAttribute'
    AttributeSet:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        name:
          type: string
          maxLength: 255
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeDefinition'
          minItems: 1
      required:
      - attributes
      - id
      - name
    AttributeSetCreate:
      type: object
      properties:
        name:
          type: string
          maxLength: 255
        attributes:
          type: array
          items:
            $ref: '#/components/schemas/AttributeDefinition'
          minItems: 1
      required:
      - attributes
      - name
    BooleanAttribute:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        type:
          $ref: '#/components/schemas/BooleanAttributeTypeEnum'
      required:
      - name
      - type
    BooleanAttributeTypeEnum:
      enum:
      - boolean
      type: string
      description: '* `boolean` - boolean'
    DateAttribute:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        type:
          $ref: '#/components/schemas/DateAttributeTypeEnum'
        min:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
        max:
          type: string
          pattern: ^[0-9]{4}-[0-9]{2}-[0-9]{2}$
      required:
      - max
      - min
      - name
      - type
    DateAttributeTypeEnum:
      enum:
      - date
      type: string
      description: '* `date` - date'
    DecimalAttribute:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        type:
          $ref: '#/components/schemas/DecimalAttributeTypeEnum'
        min:
          type: string
          pattern: ^-?[0-9]+\.[0-9]+$
        max:
          type: string
          pattern: ^-?[0-9]+\.[0-9]+$
      required:
      - max
      - min
      - name
      - type
    DecimalAttributeTypeEnum:
      enum:
      - decimal
      type: string
      description: '* `decimal` - decimal'
    District:
      type: object
      properties:
        code:
          type: string
        label:
          type: string
        label_en:
          type: string
          nullable: true
          description: Romanized place name when available.
        bounds:
          type: array
          items:
            type: number
            format: double
          maxItems: 4
          minItems: 4
      required:
      - bounds
      - code
      - label
      - label_en
    DistrictSearchError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    GeneratedIdAttribute:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        type:
          $ref: '#/components/schemas/GeneratedIdAttributeTypeEnum'
        id_format:
          $ref: '#/components/schemas/IdFormatEnum'
      required:
      - id_format
      - name
      - type
    GeneratedIdAttributeTypeEnum:
      enum:
      - id
      type: string
      description: '* `id` - id'
    HealthResponse:
      type: object
      properties:
        status:
          $ref: '#/components/schemas/StatusEnum'
      required:
      - status
    IdFormatEnum:
      enum:
      - sequential
      - uuid
      type: string
      description: |-
        * `sequential` - sequential
        * `uuid` - uuid
    IntegerAttribute:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        type:
          $ref: '#/components/schemas/IntegerAttributeTypeEnum'
        min:
          type: string
          pattern: ^-?[0-9]+$
        max:
          type: string
          pattern: ^-?[0-9]+$
      required:
      - max
      - min
      - name
      - type
    IntegerAttributeTypeEnum:
      enum:
      - integer
      type: string
      description: '* `integer` - integer'
    NullEnum:
      enum:
      - null
    PipeSetAccepted:
      type: object
      properties:
        id:
          type: string
          format: uuid
      required:
      - id
    PipeSetCreate:
      type: object
      description: Provide exactly one of district_id and prefecture_id.
      properties:
        name:
          type: string
          description: Display name for the generated pipe set.
          maxLength: 255
        district_id:
          type: string
          pattern: ^[0-9]{5}$
          maxLength: 5
          minLength: 5
        prefecture_id:
          type: string
          description: Two-digit prefecture code, including any leading zero.
          pattern: ^[0-9]{2}$
          maxLength: 2
          minLength: 2
        attribute_set_id:
          type: string
          format: uuid
      required:
      - attribute_set_id
      - name
    PipeSetCreateError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    PipeSetStatus:
      type: object
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/PipeSetStatusEnum'
        failure_reason:
          type: string
      required:
      - id
      - status
    PipeSetStatusEnum:
      enum:
      - pending
      - succeeded
      - failed
      type: string
      description: |-
        * `pending` - Pending
        * `succeeded` - Succeeded
        * `failed` - Failed
    PipeSetSummary:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        bounds:
          type: array
          items:
            type: number
            format: double
          nullable: true
          description: West, south, east, north in WGS84 degrees, or null for a set
            without pipes.
          maxItems: 4
          minItems: 4
        attribute_definitions:
          type: array
          items:
            $ref: '#/components/schemas/AttributeDefinition'
          readOnly: true
          nullable: true
          description: Ordered attribute definitions, or null when no attribute set
            is associated.
      required:
      - attribute_definitions
      - bounds
      - id
      - name
    Prefecture:
      type: object
      properties:
        code:
          type: string
        label:
          type: string
        label_en:
          type: string
          nullable: true
          description: Romanized place name when available.
        bounds:
          type: array
          items:
            type: number
            format: double
          maxItems: 4
          minItems: 4
      required:
      - bounds
      - code
      - label
      - label_en
    PrefectureSearchError:
      type: object
      properties:
        detail:
          type: string
      required:
      - detail
    RoadData:
      type: object
      properties:
        regions:
          type: array
          items:
            $ref: '#/components/schemas/RoadDataRegionEnum'
        cached_regions:
          type: array
          items:
            $ref: '#/components/schemas/RoadDataRegionEnum'
        has_roads:
          type: boolean
        active_region:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/RoadDataRegionEnum'
          - $ref: '#/components/schemas/NullEnum'
        setup:
          allOf:
          - $ref: '#/components/schemas/RoadDataSetup'
          nullable: true
      required:
      - active_region
      - cached_regions
      - has_roads
      - regions
      - setup
    RoadDataFailureCodeEnum:
      enum:
      - queue
      - download
      - import
      type: string
      description: |-
        * `queue` - Queue
        * `download` - Download
        * `import` - Import
    RoadDataRegionEnum:
      enum:
      - japan
      - chubu
      - chugoku
      - hokkaido
      - kansai
      - kanto
      - kyushu
      - shikoku
      - tohoku
      type: string
      description: |-
        * `japan` - japan
        * `chubu` - chubu
        * `chugoku` - chugoku
        * `hokkaido` - hokkaido
        * `kansai` - kansai
        * `kanto` - kanto
        * `kyushu` - kyushu
        * `shikoku` - shikoku
        * `tohoku` - tohoku
    RoadDataSetup:
      type: object
      properties:
        id:
          type: integer
        region:
          $ref: '#/components/schemas/RoadDataRegionEnum'
        status:
          $ref: '#/components/schemas/RoadDataSetupStatusEnum'
        failure:
          nullable: true
          oneOf:
          - $ref: '#/components/schemas/RoadDataFailureCodeEnum'
          - $ref: '#/components/schemas/NullEnum'
      required:
      - failure
      - id
      - region
      - status
    RoadDataSetupRequest:
      type: object
      properties:
        region:
          $ref: '#/components/schemas/RoadDataRegionEnum'
      required:
      - region
    RoadDataSetupStatusEnum:
      enum:
      - queued
      - downloading
      - importing
      - succeeded
      - failed
      type: string
      description: |-
        * `queued` - Queued
        * `downloading` - Downloading
        * `importing` - Importing
        * `succeeded` - Succeeded
        * `failed` - Failed
    StatusEnum:
      enum:
      - ok
      type: string
      description: '* `ok` - ok'
    StringAttribute:
      type: object
      properties:
        name:
          type: string
          pattern: ^[a-z][a-z0-9_]*$
        type:
          $ref: '#/components/schemas/StringAttributeTypeEnum'
        choices:
          type: array
          items:
            type: string
          minItems: 1
      required:
      - choices
      - name
      - type
    StringAttributeTypeEnum:
      enum:
      - string
      type: string
      description: '* `string` - string'
