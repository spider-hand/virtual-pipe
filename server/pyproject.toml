[project]
name = "virtual-pipe-server"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
    "celery[redis]>=5.6,<6",
    "django>=5.2.8,<5.3",
    "djangorestframework>=3.16,<4",
    "drf-spectacular>=0.28,<1",
    "duckdb==2.0.0",
    "psycopg[binary]>=3.2,<4",
]

[dependency-groups]
dev = [
    "pytest>=8,<10",
    "pytest-django>=4.11,<5",
    "ruff>=0.11,<1",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
