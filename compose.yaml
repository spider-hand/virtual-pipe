name: virtual-pipe-dev

x-postgres-environment: &postgres-environment
  POSTGRES_DB: ${POSTGRES_DB:-virtual_pipe}
  POSTGRES_USER: ${POSTGRES_USER:-virtual_pipe}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-virtual_pipe}

services:
  client:
    build: ./client
    command: sh -c "pnpm install --frozen-lockfile --store-dir /pnpm/store && pnpm dev --host 0.0.0.0"
    environment:
      API_PROXY_TARGET: http://server:8000
      MARTIN_PROXY_TARGET: http://martin:3000
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
      - client_pnpm_store:/pnpm/store
    depends_on:
      server:
        condition: service_healthy
      martin:
        condition: service_healthy

  server:
    build: ./server
    command: sh -c "uv run --locked python manage.py migrate && uv run --locked python -m pipesets.district_catalog && uv run --locked python manage.py runserver 0.0.0.0:8000"
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      <<: *postgres-environment
      DISTRICT_DATA_DIR: /data
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server:/app
      - server_venv:/app/.venv
      - ./data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "from urllib.request import urlopen; urlopen('http://127.0.0.1:8000/api/health/', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 20

  db:
    build:
      context: ./osm
      dockerfile: Dockerfile.db
    environment: *postgres-environment
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 3s
      timeout: 3s
      retries: 20

  martin:
    image: ghcr.io/maplibre/martin:1.16.1
    command: ["--config", "/config.yaml"]
    environment:
      MARTIN_DATABASE_URL: ${MARTIN_DATABASE_URL:-postgresql://${POSTGRES_USER:-virtual_pipe}:${POSTGRES_PASSWORD:-virtual_pipe}@db:5432/${POSTGRES_DB:-virtual_pipe}}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./martin/config.yaml:/config.yaml:ro
    depends_on:
      server:
        condition: service_healthy

  osm:
    profiles: [osm]
    build: ./osm
    environment:
      <<: *postgres-environment
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - osm_downloads:/downloads

volumes:
  client_node_modules:
  client_pnpm_store:
  server_venv:
  postgres_data:
  osm_downloads:
