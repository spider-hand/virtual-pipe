services:
  client:
    image: node:24-bookworm-slim
    working_dir: /app
    init: true
    environment:
      API_PROXY_TARGET: http://server:8000
      MARTIN_PROXY_TARGET: http://martin:3000
    command: >-
      sh -c "corepack pnpm install --frozen-lockfile &&
      exec corepack pnpm run dev --host 0.0.0.0 --port 5173 --strictPort"
    ports:
      - "127.0.0.1:5173:5173"
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
      - client_pnpm_store:/app/.pnpm-store

  server:
    image: virtual-pipe-server
    build: ./server
    working_dir: /app
    init: true
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/venv
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
    command: uv run --locked python manage.py runserver 0.0.0.0:8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./server:/app
      - server_venv:/opt/venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    image: virtual-pipe-server
    build: ./server
    working_dir: /app
    init: true
    environment:
      UV_PROJECT_ENVIRONMENT: /opt/venv
      POSTGRES_HOST: db
      CELERY_BROKER_URL: redis://redis:6379/0
    command: uv run --locked celery -A config worker --loglevel=info
    volumes:
      - ./server:/app
      - server_venv:/opt/venv
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 5s
      retries: 30

  martin:
    image: ghcr.io/maplibre/martin:1.16.1
    command: --config /config/config.yaml
    environment:
      POSTGRES_CONNECTION_STRING: postgres://virtual_pipe:virtual_pipe@db:5432/virtual_pipe
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./martin:/config:ro
    depends_on:
      db:
        condition: service_healthy

  osm:
    build: ./osm
    profiles: [tools]
    environment:
      PGHOST: db
      PGDATABASE: virtual_pipe
      PGUSER: virtual_pipe
      PGPASSWORD: virtual_pipe
    volumes:
      - ./osm/data:/data
      - ./osm/roads.lua:/config/roads.lua:ro
    depends_on:
      db:
        condition: service_healthy

  db:
    image: virtual-pipe-db
    build: ./db
    environment:
      POSTGRES_DB: virtual_pipe
      POSTGRES_USER: virtual_pipe
      POSTGRES_PASSWORD: virtual_pipe
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U virtual_pipe -d virtual_pipe"]
      interval: 2s
      timeout: 5s
      retries: 30

volumes:
  client_node_modules:
  client_pnpm_store:
  server_venv:
  postgres_data:
